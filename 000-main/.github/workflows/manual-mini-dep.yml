name: 🚀 Minify Selected File + Deploy Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: "Path file yang akan di minify"
        required: true
        default: "index.html"
        type: string

      project_name:
        description: "Nama project Cloudflare Pages"
        required: true
        default: "000"
        type: string

      node_version:
        description: "Versi Node.js"
        required: false
        default: "20"
        type: string

permissions:
  contents: write

concurrency:
  group: minify-single-file-${{ github.ref }}
  cancel-in-progress: false

jobs:
  minify-and-deploy:
    name: 🚀 Minify & Deploy
    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      FILE: ${{ github.event.inputs.file_path }}
      PROJECT_NAME: ${{ github.event.inputs.project_name }}

    steps:

      ########################################################
      # CHECKOUT
      ########################################################
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ########################################################
      # SETUP NODE
      ########################################################
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ github.event.inputs.node_version }}

      ########################################################
      # INSTALL TOOLS
      ########################################################
      - name: 📦 Install Minify & Deploy Tools
        run: |
          npm install -g \
            html-minifier-terser \
            terser \
            csso-cli \
            wrangler

      ########################################################
      # VALIDATE FILE
      ########################################################
      - name: 🔍 Validate File
        shell: bash
        run: |

          set -e

          if [ ! -f "$FILE" ]; then
            echo "❌ File tidak ditemukan: $FILE"
            exit 1
          fi

          EXT="${FILE##*.}"

          case "$EXT" in
            html|css|js)
              echo "✅ File valid: $FILE"
              ;;
            *)
              echo "❌ Format file tidak didukung: .$EXT"
              echo "✅ Hanya mendukung: .html .css .js"
              exit 1
              ;;
          esac

      ########################################################
      # SHOW BEFORE SIZE
      ########################################################
      - name: 📏 Show Original Size
        shell: bash
        run: |

          BEFORE_SIZE=$(wc -c < "$FILE")

          echo "📦 File: $FILE"
          echo "📏 Original Size: ${BEFORE_SIZE} bytes"

      ########################################################
      # MINIFY HTML
      ########################################################
      - name: 🌐 Minify HTML
        if: endsWith(github.event.inputs.file_path, '.html')
        shell: bash
        run: |

          set -e

          echo "🌐 Minifying HTML: $FILE"

          html-minifier-terser "$FILE" \
            --collapse-whitespace \
            --remove-comments \
            --remove-attribute-quotes \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            --remove-empty-attributes \
            --remove-optional-tags \
            --trim-custom-fragments \
            --minify-css true \
            --minify-js true \
            -o "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

      ########################################################
      # MINIFY CSS
      ########################################################
      - name: 🎨 Minify CSS
        if: endsWith(github.event.inputs.file_path, '.css')
        shell: bash
        run: |

          set -e

          echo "🎨 Minifying CSS: $FILE"

          csso "$FILE" \
            --output "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

      ########################################################
      # MINIFY JAVASCRIPT
      ########################################################
      - name: ⚡ Minify JavaScript
        if: endsWith(github.event.inputs.file_path, '.js')
        shell: bash
        run: |

          set -e

          echo "⚡ Minifying JavaScript: $FILE"

          terser "$FILE" \
            --compress \
            --mangle \
            --comments false \
            --ecma 2020 \
            -o "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

      ########################################################
      # VERIFY OUTPUT
      ########################################################
      - name: ✅ Verify Output
        shell: bash
        run: |

          set -e

          if [ ! -s "$FILE" ]; then
            echo "❌ File hasil minify kosong"
            exit 1
          fi

          echo "✅ File hasil minify valid"

      ########################################################
      # SHOW RESULT
      ########################################################
      - name: 📊 Show Result
        shell: bash
        run: |

          BEFORE_SIZE=$(git show HEAD:"$FILE" 2>/dev/null | wc -c || echo 0)
          AFTER_SIZE=$(wc -c < "$FILE")

          if [ "$BEFORE_SIZE" -gt 0 ]; then
            SAVED=$((BEFORE_SIZE - AFTER_SIZE))
          else
            SAVED=0
          fi

          echo "✅ Minify selesai"
          echo "📦 File: $FILE"
          echo "📏 Final Size: ${AFTER_SIZE} bytes"
          echo "💾 Saved: ${SAVED} bytes"

      ########################################################
      # COMMIT MINIFIED FILE
      ########################################################
      - name: 💾 Commit Minified File
        shell: bash
        run: |

          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE"

          if git diff --cached --quiet; then
            echo "ℹ️ Tidak ada perubahan untuk di commit"
          else
            git commit -m "⚡ Auto minify: $FILE"
            git push origin HEAD:${GITHUB_REF_NAME}

            echo "✅ File berhasil di commit & push"
          fi

      ########################################################
      # DEPLOY TO CLOUDFLARE
      ########################################################
      - name: ☁️ Deploy To Cloudflare Pages
        shell: bash
        run: |

          set -e

          ROOT_DIR="./"

          echo "📂 Deploy folder: $ROOT_DIR"
          echo "☁️ Project: $PROJECT_NAME"
          echo "🌿 Branch: ${GITHUB_REF_NAME}"

          wrangler pages deploy "$ROOT_DIR" \
            --project-name="$PROJECT_NAME" \
            --branch="${GITHUB_REF_NAME}"

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      ########################################################
      # SUCCESS
      ########################################################
      - name: 🎉 Success
        shell: bash
        run: |
          echo "🎉 File berhasil di minify, commit, push, & deploy ke Cloudflare Pages"