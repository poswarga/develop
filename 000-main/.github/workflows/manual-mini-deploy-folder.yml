name: 🚀 Minify Folder + Deploy Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      source_folder:
        description: "Folder source yang akan di minify & deploy"
        required: true
        default: "."
        type: string

      project_name:
        description: "Nama project Cloudflare Pages"
        required: true
        default: "webusaha-shop"
        type: string

      node_version:
        description: "Versi Node.js"
        required: false
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: minify-deploy-folder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  minify-and-deploy:
    name: 🚀 Minify Folder & Deploy
    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      SOURCE: ${{ github.event.inputs.source_folder }}
      PROJECT_NAME: ${{ github.event.inputs.project_name }}

    steps:

      ########################################################
      # CHECKOUT
      ########################################################
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      ########################################################
      # SETUP NODE
      ########################################################
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ github.event.inputs.node_version }}

      ########################################################
      # INSTALL TOOLS
      ########################################################
      - name: 📦 Install Minify & Deploy Tools
        shell: bash
        run: |

          set -e

          npm install -g \
            html-minifier-terser \
            terser \
            csso-cli \
            wrangler

      ########################################################
      # VALIDATE FOLDER
      ########################################################
      - name: 🔍 Validate Folder
        shell: bash
        run: |

          set -e

          if [ ! -d "$SOURCE" ]; then
            echo "❌ Folder tidak ditemukan: $SOURCE"
            exit 1
          fi

          echo "✅ Folder ditemukan: $SOURCE"

      ########################################################
      # SHOW BEFORE SIZE
      ########################################################
      - name: 📏 Show Original Size
        shell: bash
        run: |

          set -e

          TOTAL_BEFORE=$(find "$SOURCE" -type f \
            \( -name "*.html" -o -name "*.css" -o -name "*.js" \) \
            -exec wc -c {} + | tail -n 1 | awk '{print $1}')

          echo "📏 Total Original Size: ${TOTAL_BEFORE:-0} bytes"

      ########################################################
      # MINIFY HTML
      ########################################################
      - name: 🌐 Minify HTML
        shell: bash
        run: |

          set -e

          find "$SOURCE" -type f -name "*.html" | while read -r file
          do
            echo "🌐 HTML → $file"

            html-minifier-terser "$file" \
              --collapse-whitespace \
              --remove-comments \
              --remove-attribute-quotes \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-style-link-type-attributes \
              --use-short-doctype \
              --remove-empty-attributes \
              --remove-optional-tags \
              --trim-custom-fragments \
              --minify-css true \
              --minify-js true \
              -o "$file.tmp"

            mv "$file.tmp" "$file"
          done

      ########################################################
      # MINIFY CSS
      ########################################################
      - name: 🎨 Minify CSS
        shell: bash
        run: |

          set -e

          find "$SOURCE" -type f -name "*.css" | while read -r file
          do
            echo "🎨 CSS → $file"

            csso "$file" \
              --output "$file.tmp"

            mv "$file.tmp" "$file"
          done

      ########################################################
      # MINIFY JAVASCRIPT
      ########################################################
      - name: ⚡ Minify JavaScript
        shell: bash
        run: |

          set -e

          find "$SOURCE" -type f -name "*.js" | while read -r file
          do
            echo "⚡ JS → $file"

            terser "$file" \
              --compress \
              --mangle \
              --comments false \
              --ecma 2020 \
              -o "$file.tmp"

            mv "$file.tmp" "$file"
          done

      ########################################################
      # VERIFY OUTPUT
      ########################################################
      - name: ✅ Verify Output
        shell: bash
        run: |

          set -e

          FAILED=0

          find "$SOURCE" -type f \
            \( -name "*.html" -o -name "*.css" -o -name "*.js" \) \
            | while read -r file
          do

            if [ ! -s "$file" ]; then
              echo "❌ File kosong: $file"
              FAILED=1
            fi

          done

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "✅ Semua file valid"

      ########################################################
      # SHOW RESULT
      ########################################################
      - name: 📊 Show Result
        shell: bash
        run: |

          set -e

          TOTAL_AFTER=$(find "$SOURCE" -type f \
            \( -name "*.html" -o -name "*.css" -o -name "*.js" \) \
            -exec wc -c {} + | tail -n 1 | awk '{print $1}')

          echo "✅ Minify selesai"
          echo ""
          echo "📏 Final Size: ${TOTAL_AFTER:-0} bytes"

          echo ""
          echo "📦 File hasil minify:"
          find "$SOURCE" -type f \
            \( -name "*.html" -o -name "*.css" -o -name "*.js" \)

      ########################################################
      # DEPLOY TO CLOUDFLARE
      ########################################################
      - name: ☁️ Deploy To Cloudflare Pages
        shell: bash
        run: |

          set -e

          echo "📂 Deploy folder: $SOURCE"
          echo "☁️ Project: $PROJECT_NAME"
          echo "🌿 Branch: ${GITHUB_REF_NAME}"

          wrangler pages deploy "$SOURCE" \
            --project-name="$PROJECT_NAME" \
            --branch="${GITHUB_REF_NAME}"

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      ########################################################
      # SUCCESS
      ########################################################
      - name: 🎉 Success
        shell: bash
        run: |
          echo "🎉 Minify + Deploy berhasil"
