name: 🚀 Manual Deploy Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      deploy_path:
        description: "Folder yang akan di deploy"
        required: false
        default: "."
        type: string

      project_name:
        description: "Nama project Cloudflare Pages"
        required: true
        default: "000"
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      ########################################################
      # CHECKOUT
      ########################################################
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      ########################################################
      # SETUP NODE
      ########################################################
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      ########################################################
      # INSTALL WRANGLER
      ########################################################
      - name: 📦 Install Wrangler
        run: |
          npm install -g wrangler

      ########################################################
      # SHOW INFO
      ########################################################
      - name: 📋 Deployment Info
        run: |
          echo "🚀 Cloudflare Pages Deploy"
          echo "📁 Deploy Path: ${{ github.event.inputs.deploy_path }}"
          echo "☁️ Project: ${{ github.event.inputs.project_name }}"
          echo "🌿 Branch: ${GITHUB_REF_NAME}"

      ########################################################
      # VALIDATE PATH
      ########################################################
      - name: 🔍 Validate Deploy Path
        run: |

          DEPLOY_PATH="${{ github.event.inputs.deploy_path }}"

          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "❌ Folder tidak ditemukan: $DEPLOY_PATH"
            exit 1
          fi

          echo "✅ Folder ditemukan"

          echo ""
          echo "📂 Isi folder:"
          ls -la "$DEPLOY_PATH"

      ########################################################
      # DEPLOY
      ########################################################
      - name: ☁️ Deploy To Cloudflare Pages
        run: |

          wrangler pages deploy "${{ github.event.inputs.deploy_path }}" \
            --project-name="${{ github.event.inputs.project_name }}" \
            --branch="${GITHUB_REF_NAME}"

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      ########################################################
      # SUCCESS
      ########################################################
      - name: ✅ Deploy Success
        run: |
          echo "🎉 Deploy berhasil ke Cloudflare Pages"
